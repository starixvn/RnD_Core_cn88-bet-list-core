<div class='cn88-bet-item'>
    <!--MixParlay-->
    <div class="cn88-mix-parlay">
        <!--OfferNames-->
        <div class="cn88-offername" id="offer-name-cn88-{offerNamesId}">{offerNames}</div>
        <!--/OfferNames-->
        <a href="javascript:void(0);" onclick="{mixparlayFunction};"
           title="{mixParlayTitle}">
        </a>
        <!--SubTickets-->
        <div id="cn88-sub-tickets-{subTicketsId}" style="display: none"></div>
        <!--/SubTickets-->
    </div>
    <!--/MixParlay-->
    <!--League-->
    <div class="cn88-league">
        <!--LeagueName-->
        <span class="cn88-league-name">{leagueName}</span>
        <!--/LeagueName-->
    </div>
    <!--/League-->
    <!--MatchByTeamId-->
    <div class="cn88-teamid">
        <span class="cn88-home-team-id">{homeTeamId}</span>
        <!--VS-->
        <span> vs </span>
        <!--/VS-->
        <span class="cn88-away-team-id">{awayTeamId}</span>
    </div>
    <!--/MatchByTeamId-->
    <!--Match-->
    <div class="cn88-match">
        <span class="cn88-home-team-name">{homeTeam}</span>
        <!--VS-->
        <span> v. </span>
        <!--/VS-->
        <!--Handicap-->
        <span class="cn88-handicap"> {handicap} </span>
        <!--/Handicap-->
        <span class="cn88-away-team-name">{awayTeam}</span>
        <!--LiveScore-->
        <span class="cn88-live-score"> {liveScore} </span>
        <!--/LiveScore-->
    </div>
    <!--/Match-->
    <!--KickOffTime-->
    <div class="cn88-match">{kickOffTime}</div>
    <!--/KickOffTime-->
    <!--BetChoice-->
    <div class="cn88-bet-choice">
        <!--ChoiceName-->
        <span class="cn88-choice-name">{choiceName}</span>
        <!--/ChoiceName-->
        <!--ChoiceValue-->
        <span class="cn88-choice-value"> {choiceValue}</span>
        <!--/ChoiceValue-->
        <!--BetChoiceSplitChar-->
        <span> @ </span>
        <!--/BetChoiceSplitChar-->
        <!--Odds-->
        <span class="cn88-odds">{odds}</span>
        <!--/Odds-->
    </div>
    <!--/BetChoice-->
    <!--BetChoiceMoreInfo-->
    <div class="cn88-bet-choice-more-info">
        {betChoiceMoreInfo}
    </div>
    <!--/BetChoiceMoreInfo-->
    <!--MoreInfo-->
    <div class="cn88-more-info">
        <a href="javascript:void(0);" onclick="{moreInfoFunction};"
           title="{moreInfoTitle}" class="detail-link">
            {detailText}
        </a>
    </div>
    <!--/MoreInfo-->
</div>
